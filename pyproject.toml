[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mormi-conversation-api"
version = "0.1.0"
description = "LangGraph-based conversation API for Mormi's real-life math teaching sessions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "anthropic>=0.121,<1",
  "cryptography>=45,<47",
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30,<1",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pycryptodome>=3.23,<4",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
analysis = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "numpy>=2.2,<3",
  "safetensors>=0.6,<1",
  "torch>=2.7,<3",
  "transformers>=4.55,<5",
]

[project.scripts]
mormi-api = "mormi_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mormi_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mormi_api"]

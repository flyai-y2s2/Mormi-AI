name: CI/CD (develop → ECR → EC2)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deployment_action:
        description: >-
          Deploy the selected revision, or immediately disable new V2
          assignments on the currently running image without building,
          migrating, or prewarming.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - disable-v2
      dialogue_v2_canary_percent:
        description: >-
          Manual deploy override for newly created V2 conversations. Use the
          disable-v2 action for the emergency kill switch; only develop deploys.
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
          - '5'
          - '10'
          - '25'
          - '50'
          - '100'

concurrency:
  group: deploy-ai-develop
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: mormi-ai

jobs:
  emergency-disable-v2:
    name: Immediately disable new V2 assignments
    if: >-
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deployment_action == 'disable-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Set canary to zero on the current image
        run: |
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "bash -s" <<'REMOTE'

          set -euo pipefail

          persist_mormi_env() {
            local image="$1"
            local key="$2"
            local value="$3"

            docker run --rm \
              --user 0:0 \
              --entrypoint python \
              -v /etc/mormi-ai:/mormi-config \
              -e MORMI_PERSIST_KEY="${key}" \
              -e MORMI_PERSIST_VALUE="${value}" \
              "${image}" \
              -c '
          from pathlib import Path
          import os

          path = Path("/mormi-config/mormi.env")
          key = os.environ["MORMI_PERSIST_KEY"]
          value = os.environ["MORMI_PERSIST_VALUE"]
          prefix = f"{key}="
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          replaced = False
          for line in lines:
              if line.startswith(prefix):
                  if not replaced:
                      updated.append(prefix + value)
                      replaced = True
                  continue
              updated.append(line)
          if not replaced:
              updated.append(prefix + value)
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          '
          }

          CURRENT_IMAGE="$(docker inspect --format '{{.Config.Image}}' mormi-ai 2>/dev/null || true)"
          if [ -z "${CURRENT_IMAGE}" ]; then
            echo "no running mormi-ai image is available for the V2 kill switch"
            exit 1
          fi
          current_health="$(curl -fsS http://localhost:8000/health 2>/dev/null || true)"
          EMERGENCY_RUNTIME_CONTRACT_VERSION="legacy-v1"
          if printf '%s' "${current_health}" | grep -q '"verdict-v1"'; then
            EMERGENCY_RUNTIME_CONTRACT_VERSION="verdict-v1"
          fi

          docker network create mormi-services 2>/dev/null || true
          docker rm -f mormi-ai-canary-zero 2>/dev/null || true
          docker run -d \
            --name mormi-ai-canary-zero \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_RUNTIME_CONTRACT_VERSION="${EMERGENCY_RUNTIME_CONTRACT_VERSION}" \
            -e MORMI_DIALOGUE_V2_CANARY_PERCENT=0 \
            -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
            -e MORMI_CLASSIFIER_EFFORT=low \
            -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_SPEAKER_EFFORT=low \
            -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_EFFORT=low \
            -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
            -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
            -p 127.0.0.1:18000:8000 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${CURRENT_IMAGE}"

          candidate_ready=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:18000/health 2>/dev/null; then
              candidate_ready="yes"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^mormi-ai-canary-zero$'; then
              break
            fi
            sleep 2
          done
          if [ -z "${candidate_ready}" ]; then
            echo "canary-zero candidate failed; the current live API was not replaced"
            docker logs --tail=200 mormi-ai-canary-zero || true
            docker rm -f mormi-ai-canary-zero 2>/dev/null || true
            exit 1
          fi

          candidate_canary="$(docker exec mormi-ai-canary-zero \
            python -c 'from mormi_api.settings import get_settings; print(get_settings().dialogue_v2_canary_percent)')"
          if [ "${candidate_canary}" -ne 0 ]; then
            echo "canary-zero candidate did not apply the emergency override"
            docker rm -f mormi-ai-canary-zero
            exit 1
          fi

          persist_mormi_env \
            "${CURRENT_IMAGE}" \
            MORMI_DIALOGUE_V2_CANARY_PERCENT \
            0

          docker rm -f mormi-ai-canary-zero
          docker rm -f mormi-ai
          docker run -d \
            --name mormi-ai \
            --restart unless-stopped \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_RUNTIME_CONTRACT_VERSION="${EMERGENCY_RUNTIME_CONTRACT_VERSION}" \
            -e MORMI_DIALOGUE_V2_CANARY_PERCENT=0 \
            -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
            -e MORMI_CLASSIFIER_EFFORT=low \
            -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_SPEAKER_EFFORT=low \
            -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_EFFORT=low \
            -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
            -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
            -p 8000:8000 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${CURRENT_IMAGE}"

          api_ready=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/health 2>/dev/null; then
              api_ready="yes"
              break
            fi
            sleep 2
          done
          if [ -z "${api_ready}" ]; then
            echo "current image failed to restart with canary zero"
            docker logs --tail=200 mormi-ai || true
            exit 1
          fi
          effective_canary="$(docker exec mormi-ai \
            python -c 'from mormi_api.settings import get_settings; print(get_settings().dialogue_v2_canary_percent)')"
          if [ "${effective_canary}" -ne 0 ]; then
            echo "live API did not apply canary zero"
            exit 1
          fi
          echo "new V2 assignments are disabled"

          REMOTE

  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # The full parity/session-parent suite reaches completion locally in about
    # two minutes, but GitHub's shared runner can take over fifteen minutes.
    # Keep every release gate and allow the slower runner to finish instead of
    # canceling a healthy suite around 90% progress.
    timeout-minutes: 30
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.deployment_action == 'deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install '.[dev]'

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src scripts

      - name: Dictionary content contracts
        run: python scripts/audit_dictionary_cards.py --report /tmp/mormi-dictionary-review.md

      - name: Pytest
        run: pytest -q

      - name: Docker production image
        if: github.event_name == 'pull_request'
        run: docker build -t mormi-ai:pr-check .

  build-and-push:
    name: Build image, push to ECR
    needs: test

    # PR에서는 테스트만 수행합니다. develop push 또는 develop을 대상으로 한
    # 수동 canary 조정일 때만 배포 이미지를 생성합니다.
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_action == 'deploy'))

    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      image_uri: ${{ steps.tags.outputs.sha_image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::145305170086:role/GithubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: tags
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          echo "sha_image=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build \
            -t "${{ steps.tags.outputs.sha_image }}" \
            -t "${{ steps.tags.outputs.latest_image }}" \
            .

          docker push "${{ steps.tags.outputs.sha_image }}"
          docker push "${{ steps.tags.outputs.latest_image }}"

  deploy:
    name: Deploy container on EC2
    needs: build-and-push

    # develop push 또는 develop 수동 canary 조정인 경우에만 실제 EC2 배포
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_action == 'deploy'))

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy container on EC2
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          REGISTRY: ${{ needs.build-and-push.outputs.registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          DIALOGUE_V2_CANARY_PERCENT_OVERRIDE: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.dialogue_v2_canary_percent || '' }}

        run: |
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "IMAGE_URI='${IMAGE_URI}' REGISTRY='${REGISTRY}' AWS_REGION='${AWS_REGION}' DIALOGUE_V2_CANARY_PERCENT_OVERRIDE='${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE}' bash -s" <<'REMOTE'

          set -euo pipefail

          persist_mormi_env() {
            local image="$1"
            local key="$2"
            local value="$3"

            docker run --rm \
              --user 0:0 \
              --entrypoint python \
              -v /etc/mormi-ai:/mormi-config \
              -e MORMI_PERSIST_KEY="${key}" \
              -e MORMI_PERSIST_VALUE="${value}" \
              "${image}" \
              -c '
          from pathlib import Path
          import os

          path = Path("/mormi-config/mormi.env")
          key = os.environ["MORMI_PERSIST_KEY"]
          value = os.environ["MORMI_PERSIST_VALUE"]
          prefix = f"{key}="
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = []
          replaced = False
          for line in lines:
              if line.startswith(prefix):
                  if not replaced:
                      updated.append(prefix + value)
                      replaced = True
                  continue
              updated.append(line)
          if not replaced:
              updated.append(prefix + value)
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          '
          }

          configure_star_note_delivery() {
            local image="$1"
            local backend_ingest_key

            if ! docker ps --format '{{.Names}}' | grep -q '^mormi-backend$'; then
              echo "mormi-backend must be running before star-note delivery is enabled"
              exit 1
            fi
            backend_ingest_key="$(docker inspect mormi-backend \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | awk -F= '$1 == "MORMI_OBSERVATION_INGEST_KEY" {sub(/^[^=]*=/, ""); print; exit}')"
            if [ -z "${backend_ingest_key}" ]; then
              echo "mormi-backend has no observation ingest key"
              exit 1
            fi

            persist_mormi_env \
              "${image}" \
              MORMI_OBSERVATION_INGEST_URL \
              http://mormi-backend:8080/internal/v1/observations/events
            persist_mormi_env \
              "${image}" \
              MORMI_OBSERVATION_INGEST_KEY \
              "${backend_ingest_key}"
            persist_mormi_env \
              "${image}" \
              MORMI_STAR_NOTE_EVENTS_ENABLED \
              true
          }

          CANARY_ARGS=()
          if [ -n "${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE:-}" ]; then
            case "${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE}" in
              0|1|5|10|25|50|100) ;;
              *)
                echo "invalid manual dialogue V2 canary percent"
                exit 1
                ;;
            esac
            CANARY_ARGS=(
              -e
              "MORMI_DIALOGUE_V2_CANARY_PERCENT=${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE}"
            )
          fi

          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin "${REGISTRY}"

          # 이전 배포 이미지와 빌드 캐시 정리
          docker image prune -af >/dev/null
          docker builder prune -af >/dev/null

          # 새 이미지 다운로드
          docker pull "${IMAGE_URI}"

          # 운영 모델을 새 이미지에서 먼저 검증합니다. 실패하면 기존 서비스는 유지됩니다.
          docker run --rm \
            -v /opt/mormi/models:/opt/mormi/models:ro \
            "${IMAGE_URI}" \
            python scripts/check_ladder_runtime.py \
              --model-dir /opt/mormi/models/ladder-v2/model

          # 서비스용 Docker network 생성
          docker network create mormi-services 2>/dev/null || true

          # Scenario-scoped idempotency is an expand-contract rollout. The
          # first deploy keeps the old unique key and installs only the reader;
          # a later deploy may contract it after the live rollback image
          # explicitly advertises that reader capability.
          PREVIOUS_IMAGE="$(docker inspect --format '{{.Config.Image}}' mormi-ai 2>/dev/null || true)"
          previous_health="$(curl -fsS http://localhost:8000/health 2>/dev/null || true)"
          previous_supports_scenario_identity=""
          if printf '%s' "${previous_health}" \
            | grep -q '"conversation-scenario-idempotency-reader-v1"'; then
            previous_supports_scenario_identity="yes"
          fi
          previous_supports_v2=""
          if printf '%s' "${previous_health}" | grep -q '"verdict-v1"' \
            && printf '%s' "${previous_health}" \
              | grep -q '"dialogue-v3-snapshot-reader-v1"'; then
            previous_supports_v2="yes"
          fi
          ROLLBACK_RUNTIME_CONTRACT_VERSION="legacy-v1"
          if [ -n "${previous_supports_v2}" ]; then
            ROLLBACK_RUNTIME_CONTRACT_VERSION="verdict-v1"
          fi

          MIGRATION_TARGET="20260826_05"
          EXPECTED_IDENTITY_SCHEMA_PHASE="transition"
          DEPLOY_CANARY_ARGS=(
            -e
            "MORMI_DIALOGUE_V2_CANARY_PERCENT=0"
          )
          if [ -z "${PREVIOUS_IMAGE}" ] \
            || [ -n "${previous_supports_scenario_identity}" ]; then
            MIGRATION_TARGET="head"
            EXPECTED_IDENTITY_SCHEMA_PHASE="final"
            DEPLOY_CANARY_ARGS=("${CANARY_ARGS[@]}")
          fi

          # Apply only the phase that the current rollback reader can tolerate.
          # A migration failure leaves the current API in service.
          docker run --rm \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_RUNTIME_CONTRACT_VERSION=legacy-v1 \
            -e MORMI_DATABASE_MIGRATION_TARGET="${MIGRATION_TARGET}" \
            "${IMAGE_URI}" \
            python scripts/migrate_database.py

          # Stable copy is a deployment artifact, not a live child-request side
          # effect.  Prewarm every reviewed V2 slot after the additive migration;
          # any missing/invalid ready row blocks the candidate before traffic moves.
          # Provider latency and a single rejected draft are transient here: retry
          # the still-missing immutable rows, while keeping the final gate strict.
          # The cache backoff is at most eight seconds across these three attempts.
          PREWARM_READY=false
          for PREWARM_ATTEMPT in 1 2 3; do
            if docker run --rm \
              --network mormi-services \
              --env-file /etc/mormi-ai/mormi.env \
              -e MORMI_ENVIRONMENT=production \
              -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
              -e MORMI_STABLE_COPY_EFFORT=low \
              -e MORMI_STABLE_COPY_TIMEOUT_SECONDS=20 \
              -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
              -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
              "${IMAGE_URI}" \
              python scripts/prewarm_dialogue_v2_copy.py; then
              PREWARM_READY=true
              break
            fi
            if [ "${PREWARM_ATTEMPT}" -lt 3 ]; then
              sleep 12
            fi
          done
          if [ "${PREWARM_READY}" != "true" ]; then
            echo "Stable-copy prewarm did not produce all 45 validated ready artifacts" >&2
            exit 1
          fi

          # A warm copy cache does not exercise the live classifier or the
          # child-facing Haiku schema. Verify both provider roles with a
          # synthetic, PII-free contract before starting the candidate API.
          # A single provider-side availability failure must not force another
          # image build, but all bounded attempts must pass the exact schemas.
          MODEL_SMOKE_READY=false
          for MODEL_SMOKE_ATTEMPT in 1 2 3; do
            if docker run --rm \
              --network mormi-services \
              --env-file /etc/mormi-ai/mormi.env \
              -e MORMI_ENVIRONMENT=production \
              -e MORMI_RUNTIME_CONTRACT_VERSION=verdict-v1 \
              -e MORMI_DIALOGUE_V2_CANARY_PERCENT=0 \
              -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
              -e MORMI_CLASSIFIER_EFFORT=low \
              -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
              -e MORMI_SPEAKER_EFFORT=low \
              -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
              "${IMAGE_URI}" \
              python scripts/smoke_dialogue_v2_models.py; then
              MODEL_SMOKE_READY=true
              break
            fi
            if [ "${MODEL_SMOKE_ATTEMPT}" -lt 3 ]; then
              sleep 5
            fi
          done
          if [ "${MODEL_SMOKE_READY}" != "true" ]; then
            echo "Sonnet understanding and Haiku speaker smoke failed all attempts" >&2
            exit 1
          fi

          # 실제 API를 내리기 전에 동일한 환경의 후보 컨테이너를 먼저 확인합니다.
          docker rm -f mormi-ai-candidate 2>/dev/null || true
          docker run -d \
            --name mormi-ai-candidate \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_RUNTIME_CONTRACT_VERSION=verdict-v1 \
            "${DEPLOY_CANARY_ARGS[@]}" \
            -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
            -e MORMI_CLASSIFIER_EFFORT=low \
            -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_SPEAKER_EFFORT=low \
            -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_EFFORT=low \
            -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
            -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
            -e MORMI_OBSERVATION_INGEST_URL= \
            -e MORMI_OBSERVATION_INGEST_KEY= \
            -p 127.0.0.1:18000:8000 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${IMAGE_URI}"

          candidate_ready=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:18000/health 2>/dev/null; then
              candidate_ready="yes"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^mormi-ai-candidate$'; then
              break
            fi
            sleep 2
          done
          if [ -z "${candidate_ready}" ]; then
            echo "candidate API health check failed; live API was not replaced"
            docker logs --tail=200 mormi-ai-candidate || true
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi

          candidate_health="$(curl -fsS http://localhost:18000/health)"
          if ! printf '%s' "${candidate_health}" | grep -q '"verdict-v1"'; then
            echo "candidate does not advertise the verdict-v1 reader/runtime capability"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -q '"dialogue-v3-snapshot-reader-v1"'; then
            echo "candidate cannot read the pinned home and life conversation snapshots"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -q '"conversation-scenario-idempotency-reader-v1"'; then
            echo "candidate cannot read the scenario-scoped conversation identity"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -Eq "\"conversation_identity_schema_phase\"[[:space:]]*:[[:space:]]*\"${EXPECTED_IDENTITY_SCHEMA_PHASE}\""; then
            echo "candidate identity schema phase does not match the selected migration phase"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -Eq '"llm_configured"[[:space:]]*:[[:space:]]*true'; then
            echo "candidate has no configured LLM provider"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -Eq '"environment"[[:space:]]*:[[:space:]]*"production"'; then
            echo "candidate is not using the production environment profile"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if ! printf '%s' "${candidate_health}" \
            | grep -Eq '"runtime_contract_version"[[:space:]]*:[[:space:]]*"verdict-v1"'; then
            echo "candidate effective runtime is not verdict-v1"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          candidate_canary_percent="$(docker exec mormi-ai-candidate \
            python -c 'from mormi_api.settings import get_settings; print(get_settings().dialogue_v2_canary_percent)')"
          if ! printf '%s' "${candidate_health}" \
            | grep -Eq "\"dialogue_v2_canary_percent\"[[:space:]]*:[[:space:]]*${candidate_canary_percent}([,}])"; then
            echo "candidate health does not match its effective V2 canary percent"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if [ "${EXPECTED_IDENTITY_SCHEMA_PHASE}" = "transition" ] \
            && [ "${candidate_canary_percent}" -ne 0 ]; then
            echo "transition schema must keep newly created V2 conversations at canary 0"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi
          if [ "${candidate_canary_percent}" -gt 0 ] && [ -z "${previous_supports_v2}" ]; then
            echo "V2 canary activation requires a snapshot-compatible verdict-v1 rollback image"
            echo "deploy this image once with MORMI_DIALOGUE_V2_CANARY_PERCENT=0 first"
            docker rm -f mormi-ai-candidate 2>/dev/null || true
            exit 1
          fi

          # A manual canary override is an operational source-of-truth change,
          # not a one-container flag. Persist it only after the candidate has
          # passed every gate so the next automatic develop deployment cannot
          # silently restore an older percentage from the env file.
          PERSISTED_CANARY_PERCENT=""
          if [ "${EXPECTED_IDENTITY_SCHEMA_PHASE}" = "transition" ]; then
            # Keep host-owned configuration safe across container recreation;
            # the second, contract-phase deploy must opt in again explicitly.
            PERSISTED_CANARY_PERCENT="0"
          elif [ -n "${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE:-}" ]; then
            PERSISTED_CANARY_PERCENT="${DIALOGUE_V2_CANARY_PERCENT_OVERRIDE}"
          fi
          if [ -n "${PERSISTED_CANARY_PERCENT}" ]; then
            persist_mormi_env \
              "${IMAGE_URI}" \
              MORMI_DIALOGUE_V2_CANARY_PERCENT \
              "${PERSISTED_CANARY_PERCENT}"
          fi
          persist_mormi_env \
            "${IMAGE_URI}" \
            MORMI_RUNTIME_CONTRACT_VERSION \
            verdict-v1
          # The BE contract is already deployed. Reuse its private ingest key
          # without printing it, persist the container-network URL, and open
          # the pending star-note outbox only after every candidate gate passes.
          configure_star_note_delivery "${IMAGE_URI}"
          docker rm -f mormi-ai-candidate

          # 검증된 후보로 API를 교체합니다.
          docker rm -f mormi-ai 2>/dev/null || true
          docker run -d \
            --name mormi-ai \
            --restart unless-stopped \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_RUNTIME_CONTRACT_VERSION=verdict-v1 \
            "${DEPLOY_CANARY_ARGS[@]}" \
            -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
            -e MORMI_CLASSIFIER_EFFORT=low \
            -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_SPEAKER_EFFORT=low \
            -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_EFFORT=low \
            -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
            -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
            -p 8000:8000 \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${IMAGE_URI}"

          api_ready=""
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/health 2>/dev/null; then
              api_ready="yes"
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^mormi-ai$'; then
              break
            fi
            sleep 2
          done
          if [ -z "${api_ready}" ]; then
            echo "new API failed after switch; restoring previous image"
            docker logs --tail=200 mormi-ai || true
            docker rm -f mormi-ai 2>/dev/null || true
            if [ -n "${PREVIOUS_IMAGE}" ]; then
              docker run -d \
                --name mormi-ai \
                --restart unless-stopped \
                --network mormi-services \
                --env-file /etc/mormi-ai/mormi.env \
                -e MORMI_ENVIRONMENT=production \
                -e MORMI_RUNTIME_CONTRACT_VERSION="${ROLLBACK_RUNTIME_CONTRACT_VERSION}" \
                "${DEPLOY_CANARY_ARGS[@]}" \
                -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
                -e MORMI_CLASSIFIER_EFFORT=low \
                -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
                -e MORMI_SPEAKER_EFFORT=low \
                -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
                -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
                -e MORMI_STABLE_COPY_EFFORT=low \
                -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
                -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
                -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=false \
                -p 8000:8000 \
                --log-opt max-size=10m \
                --log-opt max-file=5 \
                "${PREVIOUS_IMAGE}"
              rollback_ready=""
              for i in $(seq 1 30); do
                if curl -fsS -o /dev/null http://localhost:8000/health 2>/dev/null; then
                  rollback_ready="yes"
                  break
                fi
                sleep 2
              done
              if [ -z "${rollback_ready}" ]; then
                echo "previous API image also failed health check"
                docker logs --tail=200 mormi-ai || true
              fi
            fi
            exit 1
          fi

          echo "health:"
          live_health="$(curl -fsS http://localhost:8000/health)"
          printf '%s\n' "${live_health}"
          if ! printf '%s' "${live_health}" \
            | grep -Eq '"observation_ingest_enabled"[[:space:]]*:[[:space:]]*true' \
            || ! printf '%s' "${live_health}" \
              | grep -Eq '"star_note_events_enabled"[[:space:]]*:[[:space:]]*true'; then
            echo "live API did not enable star-note delivery"
            exit 1
          fi

          # 새 API가 정상인 경우에만 분석 워커를 교체합니다.
          docker rm -f mormi-ladder-worker 2>/dev/null || true

          docker run -d \
            --name mormi-ladder-worker \
            --restart unless-stopped \
            --network mormi-services \
            --env-file /etc/mormi-ai/mormi.env \
            -e MORMI_ENVIRONMENT=production \
            -e MORMI_CLASSIFIER_MODEL=claude-sonnet-4-6 \
            -e MORMI_CLASSIFIER_EFFORT=low \
            -e MORMI_SPEAKER_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_SPEAKER_EFFORT=low \
            -e MORMI_REPORT_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_MODEL=claude-sonnet-4-6 \
            -e MORMI_STABLE_COPY_EFFORT=low \
            -e MORMI_STABLE_COPY_VALIDATOR_VERSION=stable-copy-validator-v2 \
            -e MORMI_STAR_NOTE_MODEL=claude-haiku-4-5-20251001 \
            -e MORMI_LADDER_MODEL_DIR=/opt/mormi/models/ladder-v2/model \
            -e MORMI_LADDER_ANALYSIS_WORKER_ENABLED=true \
            -e MORMI_LADDER_ANALYSIS_POLL_INTERVAL_SECONDS=2 \
            -e MORMI_LADDER_ANALYSIS_BATCH_SIZE=1 \
            -e MORMI_LADDER_ANALYSIS_LEASE_SECONDS=180 \
            -v /opt/mormi/models:/opt/mormi/models:ro \
            --log-opt max-size=10m \
            --log-opt max-file=5 \
            "${IMAGE_URI}" \
            python scripts/run_ladder_worker.py

          sleep 5

          if ! docker ps --format '{{.Names}}' | grep -q '^mormi-ladder-worker$'; then
            echo "ladder worker exited during startup"
            docker logs --tail=200 mormi-ladder-worker || true
            exit 1
          fi

          # 모델이 없던 이전 배포에서 실패한 작업만 한 번 되살립니다.
          # idempotency key는 유지되므로 같은 학습을 새 작업으로 중복 생성하지 않습니다.
          docker exec mormi-ladder-worker \
            python scripts/requeue_ladder_analyses.py --confirm

          docker image prune -f >/dev/null

          docker ps --filter name=mormi-ai --filter name=mormi-ladder-worker

          REMOTE

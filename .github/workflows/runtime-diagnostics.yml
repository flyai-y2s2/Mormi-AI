name: Runtime diagnostics (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recent-ai-errors:
    name: Read recent Mormi-AI errors
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Read sanitized recent logs
        run: |
          ssh -i ~/.ssh/id_deploy \
              "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
              "docker logs --since 20m --tail=300 mormi-ai 2>&1 \
                | grep -E 'ERROR|Traceback|Exception|sqlalchemy|asyncpg|POST /v1|HTTP/1.1. [45][0-9][0-9]' \
                || true"
